name: Publish Web App

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore MoneyPuck simulation CSV cache
        id: restore-moneypuck-cache
        uses: actions/cache/restore@v4
        with:
          path: cache/online/moneypuck
          key: moneypuck-simulations-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            moneypuck-simulations-${{ runner.os }}-

      - name: Compile package
        run: python -m compileall -q hockey_app

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Check static JavaScript syntax
        run: node --check docs/app.js

      - name: Export static web data
        run: python -m hockey_app.tools.export_web --out docs --refresh

      - name: Fingerprint MoneyPuck simulation CSV cache
        id: moneypuck-cache-key
        shell: bash
        run: |
          if find cache/online/moneypuck -type f -name '*.csv' -print -quit 2>/dev/null | grep -q .; then
            digest="$({ find cache/online/moneypuck -type f -name '*.csv' -print0 | sort -z | xargs -0 sha256sum; } | sha256sum | awk '{print $1}')"
            echo "key=moneypuck-simulations-${{ runner.os }}-${digest}" >> "$GITHUB_OUTPUT"
          else
            echo "key=" >> "$GITHUB_OUTPUT"
          fi

      - name: Save MoneyPuck simulation CSV cache
        if: >-
          steps.moneypuck-cache-key.outputs.key != '' &&
          steps.restore-moneypuck-cache.outputs.cache-matched-key != steps.moneypuck-cache-key.outputs.key
        uses: actions/cache/save@v4
        with:
          path: cache/online/moneypuck
          key: ${{ steps.moneypuck-cache-key.outputs.key }}

      - name: Validate export and summarize status
        run: python -m hockey_app.tools.validate_web docs/data.json --require-nhl --require-complete-nhl

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
