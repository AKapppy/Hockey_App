name: Publish Web App

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile package
        run: python -m compileall -q hockey_app

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Check static JavaScript syntax
        run: node --check docs/app.js

      - name: Export static web data
        run: python -m hockey_app.tools.export_web --out docs --refresh

      - name: Validate export and summarize status
        run: python -m hockey_app.tools.validate_web docs/data.json --require-nhl --require-complete-nhl

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
